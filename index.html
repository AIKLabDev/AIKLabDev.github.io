<!doctype html>
<html lang="ko" class="booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/aikorea-logo.png" />

    <title>AIKOREA 채용 | AMR 지게차 · 팔레타이징 로봇 개발</title>
    <meta
      name="description"
      content="AIKOREA는 AMR 지게차와 팔레타이징 로봇을 개발합니다. NVIDIA Isaac Sim 디지털 트윈에서 검증하고 실물 장비로 이관하는 일을 함께할 동료를 찾습니다."
    />
    <meta name="theme-color" content="#0a1628" />

    <!--
      앱이 그려지기 전 첫 페인트가 흰색으로 번쩍이는 것을 막는다.
      body 배경(bg-page)은 밝은 색이라, React 가 로딩 화면을 그리기 전까지 흰 화면이
      그대로 보인다. 로딩 화면은 React 가 그리는 것이라 이 구간을 덮을 수 없다.
      App 이 마운트되면 booting 클래스를 뗀다(useLayoutEffect — 페인트 전).
      선택자 특이성이 body 규칙보다 높아 로드 순서와 무관하게 이긴다.
    -->
    <style>
      html.booting,
      html.booting body {
        background-color: #05101f;
      }
    </style>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="AIKOREA 채용 | AMR 지게차 · 팔레타이징 로봇 개발" />
    <meta
      property="og:description"
      content="시뮬레이션에서 검증하고, 현장에서 움직입니다. AIKOREA와 함께할 로보틱스 엔지니어를 찾습니다."
    />
    <meta property="og:image" content="/media/hero-forklift.jpg" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="preload" as="image" href="/media/hero-forklift.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
